apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  labels:
    app: cpu-stress
spec:
  nodeSelector:
    role: stress                     # pins to minikube-m03
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress
      resources:
        requests:
          cpu: "1000m"
          memory: "128Mi"
        limits:
          cpu: "3000m"
          memory: "256Mi"
      command: ["stress"]
      args: ["--cpu", "4", "--timeout", "300"]